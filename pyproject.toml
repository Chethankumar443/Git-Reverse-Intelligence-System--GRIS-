[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitreverse"
version = "1.1.0"
description = "Git Reverse Intelligence System (GRIS) — Production Repository Intelligence Desktop & CLI"
readme = "README.md"
authors = [
    { name = "Chethan Kumar", email = "chethankumar443@gmail.com" }
]
license = "MIT"
keywords = [
    "git", "reverse-engineering", "code-analysis", "ast", "llm",
    "copilot", "pyside6", "fts5", "repository-intelligence", "ai"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "openai>=1.30.0",
    "requests>=2.31.0",
    "SQLAlchemy>=2.0.0",
    "keyring>=24.0.0",
    "Jinja2>=3.1.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Chethankumar443/Git-Reverse-Intelligence-System--GRIS-"
Repository = "https://github.com/Chethankumar443/Git-Reverse-Intelligence-System--GRIS-.git"
Documentation = "https://github.com/Chethankumar443/Git-Reverse-Intelligence-System--GRIS-#readme"
Changelog = "https://github.com/Chethankumar443/Git-Reverse-Intelligence-System--GRIS-/blob/main/CHANGELOG.md"
Issues = "https://github.com/Chethankumar443/Git-Reverse-Intelligence-System--GRIS-/issues"

[project.scripts]
gitreverse = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
