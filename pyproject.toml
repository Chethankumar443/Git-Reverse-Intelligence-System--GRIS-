[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitreverse"
version = "1.0.0"
description = "Git Repository Reverse Engineering Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Chethan Kumar" }
]
dependencies = [
    "sqlmodel>=0.0.22",
    "pygit2>=1.14.0",
    "tree-sitter>=0.21.3",
    "rich>=13.7.0",
    "textual>=0.50.0",
    "pydantic>=2.6.0",
    "toml>=0.10.2",
]

[project.scripts]
gitreverse = "gitreverse.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitreverse*"]
