[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitreverse"
version = "1.0.0"
description = "Reverse-engineer any GitHub repository with AI — local-first, evidence-backed terminal UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Chethan Kumar", email = "chethankumar443@gmail.com" }
]
keywords = [
    "git", "reverse-engineering", "ai", "llm", "tui", "terminal",
    "code-analysis", "repository", "openrouter", "static-analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "sqlmodel>=0.0.22",
    "pygit2>=1.14.0",
    "tree-sitter>=0.21.3",
    "rich>=13.7.0",
    "textual>=0.50.0",
    "pydantic>=2.6.0",
    "toml>=0.10.2",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/chethankumar443/git-reverse"
Repository = "https://github.com/chethankumar443/git-reverse"
Changelog = "https://github.com/chethankumar443/git-reverse/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/chethankumar443/git-reverse/issues"

[project.scripts]
gitreverse = "gitreverse.cli.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyinstaller>=6.0",
    "build>=1.2",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gitreverse*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
