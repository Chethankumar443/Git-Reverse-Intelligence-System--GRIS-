[project]
name = "git-reverse"
version = "0.1.0"
description = "A local-first Repository Intelligence Platform that transforms any Git repository into structured knowledge."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Git Reverse" }]
requires-python = ">=3.12"
keywords = ["git", "ast", "reverse-engineering", "tui", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # TUI & Rendering
    "textual>=0.80.1",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.48",
    # Git Operations
    "gitpython>=3.1.43",
    # AST Parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-go>=0.23.0",
    # Graph Engine
    "networkx>=3.4.2",
    # Database
    "aiosqlite>=0.20.0",
    # Configuration & Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    # Secrets Storage
    "keyring>=25.5.0",
    # HTTP Client (for OpenRouter)
    "httpx>=0.28.0",
    # Background Jobs
    "apscheduler>=3.10.4",
    # Logging
    "structlog>=24.4.0",
    # Utilities
    "click>=8.1.8",
    "humanize>=4.11.0",
    "platformdirs>=4.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.122.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.1",
    # Type stubs
    "types-networkx>=3.4.0",
]

[project.scripts]
git-reverse = "git_reverse.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_reverse"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.122.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.1",
    "types-networkx>=3.4.0",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # bandit security checks
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101", # Missing type annotation for `self`
    "ANN102", # Missing type annotation for `cls`
    "S101",   # Use of `assert` (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]

# ── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
mypy_path = "src"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/git_reverse --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
source = ["src/git_reverse"]
# TUI and CLI entry-point require a live terminal; covered by E2E tests in Phase 6
omit = [
    "*/tui/app.py",
    "*/main.py",
    "*/tests/*",
]
