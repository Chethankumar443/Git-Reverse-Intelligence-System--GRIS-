name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed to create GitHub Release and upload assets

jobs:
  # ── Step 1: Build PyInstaller one-file binaries ──────────────────────────
  build-binary:
    name: Build binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: gitreverse-linux-x86_64
            binary_path: dist/gitreverse
          - os: windows-latest
            artifact_name: gitreverse-windows-x64.exe
            binary_path: dist/gitreverse.exe
          - os: macos-latest
            artifact_name: gitreverse-macos-universal
            binary_path: dist/gitreverse

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libgit2 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgit2-dev

      - name: Install libgit2 (macOS)
        if: runner.os == 'macOS'
        run: brew install libgit2

      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build one-file binary
        run: |
          pyinstaller \
            --onefile \
            --name gitreverse \
            --hidden-import gitreverse \
            --collect-data textual \
            --collect-data tree_sitter \
            gitreverse/cli/app.py

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: mv dist/gitreverse.exe dist/${{ matrix.artifact_name }}
        shell: bash

      - name: Rename binary (non-Windows)
        if: runner.os != 'Windows'
        run: mv dist/gitreverse dist/${{ matrix.artifact_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 1

  # ── Step 2: Publish to PyPI ───────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    needs: build-binary
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  # ── Step 3: Create GitHub Release with binaries ───────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binary, publish-pypi]
    steps:
      - uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md \
            | head -n -1 \
            | tail -n +2)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Git Reverse ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.RELEASE_NOTES }}

            ---

            ## Install

            **pip:**
            ```bash
            pip install gitreverse==${{ github.ref_name }}
            ```

            **pipx:**
            ```bash
            pipx install gitreverse
            ```

            **Standalone binary:** download from the assets below — no Python required.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/**
          generate_release_notes: false
