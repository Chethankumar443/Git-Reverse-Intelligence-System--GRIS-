name: Git Reverse Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run Test Suite
        run: |
          python -m pytest

      - name: Build Executable & Desktop Shortcut Package
        run: |
          python scripts/build_release.py

      - name: Compute SHA256 Checksums
        shell: powershell
        run: |
          Get-FileHash -Path dist\git-reverse.exe -Algorithm SHA256 | Format-List > dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/git-reverse.exe
            dist/SHA256SUMS.txt
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
